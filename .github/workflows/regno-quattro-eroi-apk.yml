name: Compila Il Regno dei Quattro Eroi APK
on:
  push:
    branches: [regno-quattro-eroi-apk]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo "Android SDK not found"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Build APK
        working-directory: android-game
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Il-Regno-dei-Quattro-Eroi-APK
          path: android-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
