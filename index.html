<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071633">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=6">
<title>BeparyTech Arcade</title>
</head>
<body>
<header class="top">
  <div class="brand"><span>🎮</span><div><b>BeparyTech <i>ARCADE</i></b><small>Giochi, impara, divertiti!</small></div></div>
  <div class="topBtns"><button id="soundBtn" aria-label="Audio">🔊</button><button id="installBtn" aria-label="Aggiungi alla Home">＋</button></div>
</header>
<main>
<section class="hero">
  <img src="arcade-hero.jpg" alt="BeparyTech Arcade">
  <div class="heroShade"><span>3–10 ANNI</span><h1>Piccoli giochi.<br><em>Grandi sogni.</em></h1><p>20 giochi completi, controlli touch, voce italiana, musica, livelli e record.</p></div>
</section>
<nav class="filters">
<button class="active" data-cat="all">🏠 Tutti</button>
<button data-cat="action">🎮 Azione</button>
<button data-cat="adventure">⛰️ Avventura</button>
<button data-cat="learning">🎓 Educativi</button>
<button data-cat="creative">🎨 Creativi</button>
<button data-cat="sport">⚽ Sport</button>
<button data-cat="special">⭐ Speciali</button>
</nav>
<section id="gamesGrid" class="grid"></section>
</main>

<section id="gameOverlay" class="overlay hidden" aria-label="Gioco">
  <div class="gameTop">
    <button id="exitBtn">← Esci</button>
    <b id="gameTitle"></b>
    <div><button id="restartBtn">↻</button><button id="fullBtn">⛶</button></div>
  </div>
  <div id="gameStage"></div>
</section>
<div id="toast" class="toast hidden"></div>
<script src="app.js?v=6"></script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js?v=6').catch(()=>{})}</script>
</body></html>
